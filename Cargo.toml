[package]
name = "freakshow-ai"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cluster-topics"
path = "src/cluster_topics.rs"

[[bin]]
name = "cluster-topics-v2"
path = "src/cluster_topics_v2.rs"

[[bin]]
name = "rag-backend"
path = "src/rag_backend.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
indicatif = { version = "0.17", features = ["rayon"] }
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
futures = "0.3"
clap = { version = "4.5", features = ["derive"] }

# Backend (HTTP API)
axum = { version = "0.7", features = ["macros", "json"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
moka = { version = "0.12", features = ["future"] }

# V2 dependencies for improved clustering
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-rand = "0.15"
rand = "0.8"
rand_distr = "0.4"
ordered-float = "4.2"

# Analytics
rusqlite = { version = "0.31", features = ["bundled"] }
maxminddb = "0.24"
sha2 = "0.10"
hex = "0.4"

# LanceDB for vector storage (matching Node.js 0.22.3)
# Disable all default features (aws, azure, gcs, oss, dynamodb) - we only need local file access
lancedb = { version = "0.22", default-features = false }
# Keep Arrow versions aligned with Lance/LanceDB to avoid duplicate major versions (breaks downcasting).
arrow = "56.2.0"
arrow-array = "56.2.0"
arrow-schema = "56.2.0"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
